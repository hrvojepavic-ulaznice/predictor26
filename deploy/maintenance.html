<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Predictor26 update in progress</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f8fafc;
        color: #111827;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        background: #f8fafc;
      }

      .page-shell {
        min-height: 100%;
        display: flex;
        flex-direction: column;
      }

      header {
        border-bottom: 1px solid #e5e7eb;
        background: rgba(248, 250, 252, 0.92);
      }

      .site-header {
        width: min(1120px, calc(100% - 32px));
        min-height: 64px;
        margin: 0 auto;
        display: flex;
        align-items: center;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: #111827;
        font-size: 1rem;
        font-weight: 700;
        text-decoration: none;
        white-space: nowrap;
      }

      .brand-mark {
        display: grid;
        width: 34px;
        height: 34px;
        place-items: center;
        border-radius: 8px;
        background: #111827;
        color: #ffffff;
        font-size: 0.74rem;
        font-weight: 850;
        line-height: 1;
      }

      .content {
        flex: 1;
        width: min(1120px, calc(100% - 32px));
        margin: 32px auto 56px;
        display: grid;
        align-items: center;
      }

      main {
        width: min(100%, 520px);
        padding: 24px;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 10px 24px rgba(17, 24, 39, 0.08);
      }

      .label {
        margin: 0 0 14px;
        color: #4b5563;
        font-size: 0.82rem;
        font-weight: 700;
        text-transform: uppercase;
      }

      .status-icon {
        display: grid;
        width: 50px;
        height: 50px;
        margin-bottom: 18px;
        place-items: center;
        border-radius: 8px;
        background: #eef2ff;
      }

      .status-icon::before {
        content: "";
        width: 24px;
        height: 24px;
        border: 3px solid #3730a3;
        border-top-color: transparent;
        border-radius: 999px;
      }

      h1 {
        margin: 0;
        color: #111827;
        font-size: 2.2rem;
        line-height: 1.05;
        letter-spacing: 0;
      }

      p {
        margin: 16px 0 0;
        color: #4b5563;
        font-size: 1rem;
        line-height: 1.55;
      }

      button {
        margin-top: 24px;
        min-height: 44px;
        padding: 0 18px;
        border: 1px solid #111827;
        border-radius: 8px;
        background: #111827;
        color: #ffffff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        transition:
          background-color 160ms ease,
          border-color 160ms ease;
      }

      button:hover,
      button:focus-visible {
        background: #1f2937;
        border-color: #1f2937;
      }

      button:focus-visible {
        outline: 2px solid #c7d2fe;
        outline-offset: 3px;
      }

      @media (max-width: 520px) {
        .site-header,
        .content {
          width: min(100% - 24px, 1120px);
        }

        .site-header {
          min-height: 60px;
        }

        .content {
          margin-top: 24px;
          margin-bottom: 40px;
          align-items: start;
        }

        main {
          padding: 20px;
        }

        h1 {
          font-size: 1.85rem;
        }

        button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="page-shell">
      <header>
        <div class="site-header">
          <div class="brand" aria-label="Predictor26">
            <span class="brand-mark" aria-hidden="true">P26</span>
            <span>Predictor26</span>
          </div>
        </div>
      </header>

      <div class="content">
        <main>
          <div class="status-icon" aria-hidden="true"></div>
          <p class="label">Maintenance</p>
          <h1>Update in progress</h1>
          <p>The app is being updated. Please refresh the page in about 2 minutes.</p>
          <button type="button" onclick="window.location.reload()">Refresh</button>
        </main>
      </div>
    </div>
  </body>
</html>
