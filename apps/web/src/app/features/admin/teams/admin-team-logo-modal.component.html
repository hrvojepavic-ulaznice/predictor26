<form class="team-logo-modal" [formGroup]="logoForm" (ngSubmit)="submit()">
  <header>
    <p class="section-label">Team icon</p>
    <h2 id="team-logo-modal-title">Edit team icon</h2>
    <p>{{ teamName() }}</p>
  </header>

  <div class="logo-preview" aria-hidden="true">
    @if (previewUrl(); as url) {
      <img [src]="url" alt="">
    } @else {
      <span>No icon</span>
    }
  </div>

  <div
    class="image-drop-zone"
    role="button"
    tabindex="0"
    (paste)="handlePaste($event)"
    (dragover)="handleDragOver($event)"
    (drop)="handleDrop($event)"
  >
    <span>Paste or drop image here</span>
    <small>PNG, JPG, or WebP up to 300 KB</small>
    <label class="file-button">
      <input type="file" accept="image/png,image/jpeg,image/webp" [disabled]="isSubmitting()" (change)="handleFileInput($event)">
      Choose image
    </label>
  </div>

  <button class="clear-button" type="button" [disabled]="isSubmitting() || !previewUrl()" (click)="removeLogo()">Remove icon</button>

  <label class="form-field">
    <span>Secret code</span>
    <input type="password" formControlName="secretCode" maxlength="128" autocomplete="current-password" [readonly]="isSubmitting()">
  </label>

  @if (fileErrorMessage(); as message) {
    <p class="modal-error">{{ message }}</p>
  }

  @if (errorMessage(); as message) {
    <p class="modal-error">{{ message }}</p>
  }

  <div class="modal-actions">
    <button class="secondary-button" type="button" [disabled]="isSubmitting()" (click)="cancel()">Cancel</button>
    <button class="primary-button" type="submit" [disabled]="isSubmitting() || logoForm.invalid || !hasLogoChange()">
      {{ isSubmitting() ? 'Saving...' : 'Save icon' }}
    </button>
  </div>
</form>
