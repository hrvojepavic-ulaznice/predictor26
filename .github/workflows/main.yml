name: Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Package
        run: |
          tar -czf release.tar.gz \
              --exclude=.git \
              --exclude=node_modules \
              --exclude=dist \
              --exclude=.angular \
              --exclude=coverage \
              deploy \
              apps \
              scripts \
              package.json \
              package-lock.json \
              tsconfig.json

      - name: SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.PI_SSH_KEY }}" \
            > ~/.ssh/id_ed25519

          chmod 600 ~/.ssh/id_ed25519

      - name: Upload
        run: |
          scp \
            -o StrictHostKeyChecking=no \
            release.tar.gz \
            webdev@${{ secrets.PI_HOST }}:/tmp/

          scp \
            -o StrictHostKeyChecking=no \
            deploy/maintenance.html \
            webdev@${{ secrets.PI_HOST }}:/tmp/predictor26-maintenance.html

      - name: Deploy
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            webdev@${{ secrets.PI_HOST }} \
            "sudo mkdir -p /var/www/predictor26-maintenance && sudo cp /tmp/predictor26-maintenance.html /var/www/predictor26-maintenance/predictor26-maintenance.html && if [ -x /usr/local/bin/predictor26-maintenance ]; then sudo /usr/local/bin/predictor26-maintenance on; fi; trap 'if [ -x /usr/local/bin/predictor26-maintenance ]; then sudo /usr/local/bin/predictor26-maintenance off; fi' EXIT; /opt/predictor26/deploy.sh && if [ -f /opt/predictor26/current/deploy/setup-nginx-maintenance.sh ]; then PREDICTOR26_NGINX_CONFIG=/etc/nginx/sites-available/ivanjkv PREDICTOR26_NGINX_SERVER_NAME=predictor26.ivanjkv.cc bash /opt/predictor26/current/deploy/setup-nginx-maintenance.sh; fi && bash /opt/predictor26/current/scripts/ensure-api-env.sh && sudo /usr/local/bin/predictor26-restart"
