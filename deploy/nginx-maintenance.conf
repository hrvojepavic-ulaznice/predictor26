# Include this inside the Predictor26 nginx server block, not inside a location block.
#
# Example:
#   server {
#     server_name example.com;
#     include /etc/nginx/snippets/predictor26-maintenance.conf;
#     ...
#   }

error_page 502 503 504 /predictor26-maintenance.html;

if (-f /var/www/predictor26-maintenance/enabled) {
  return 503;
}

location = /predictor26-maintenance.html {
  root /var/www/predictor26-maintenance;
  internal;
  add_header Cache-Control "no-store" always;
  add_header Retry-After "120" always;
}
